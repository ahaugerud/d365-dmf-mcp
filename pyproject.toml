[project]
name = "d365-dmf-mcp"
version = "0.2.0"
description = "Local, single-user MCP server to import/export data via Dynamics 365 F&O Data Management (DMF), authenticated as you via Entra ID"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Alexander Haugerud", email = "ahaugerud@inspirit365.com" },
]
keywords = ["mcp", "dynamics-365", "d365", "dmf", "data-management", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "azure-identity>=1.25.3",
    "mcp>=1.0,<2",
    "openpyxl>=3.1.5",
    "requests>=2.31",
]

[project.urls]
Repository = "https://github.com/ahaugerud/d365-dmf-mcp"

[project.scripts]
d365-dmf-mcp = "d365_dmf_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d365_dmf_mcp"]
